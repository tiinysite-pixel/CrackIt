{% extends "base.html" %}
{% block admin_title %}Bulk Add Questions{% endblock %}
{% block content %}
<h3 class="mb-4">Add Multiple Questions at Once</h3>
<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">

            <div class="mb-4 p-3 border rounded bg-light">
                <h6>Create a new company (optional)</h6>
                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label">New Company Name</label>
                        <input type="text" name="new_company" class="form-control" placeholder="e.g., AMAZON">
                    </div>
                </div>
                <small class="text-muted">If filled, all rows below use this new company.</small>
            </div>

            <div id="questions-container">
                <div class="question-row row g-2 align-items-end mb-3 pb-3 border-bottom">
                    <div class="col-md-5">
                        <label class="form-label">Question Text</label>
                        <textarea name="question_text" class="form-control" rows="2" placeholder="Enter question..."></textarea>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Category</label>
                        <input type="text" name="category" class="form-control" value="Technical">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Difficulty</label>
                        <select name="difficulty" class="form-select">
                            <option value="Easy">Easy</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Company</label>
                        <select name="company_name" class="form-select">
                            <option value="">-- Use new above --</option>
                            {% for c in companies %}
                            <option value="{{ c.name }}">{{ c.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-danger remove-row" style="display:none;">✖</button>
                    </div>
                </div>
            </div>

            <button type="button" id="add-row" class="btn btn-secondary mt-2">+ Add Another Question</button>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Submit All</button>
                <a href="{{ url_for('question_bank') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('add-row').addEventListener('click', function() {
    let container = document.getElementById('questions-container');
    let original = container.querySelector('.question-row');
    let newRow = original.cloneNode(true);
    newRow.querySelector('textarea').value = '';
    newRow.querySelector('input[name="category"]').value = 'Technical';
    newRow.querySelector('select[name="difficulty"]').selectedIndex = 1;
    newRow.querySelector('select[name="company_name"]').selectedIndex = 0;
    let removeBtn = newRow.querySelector('.remove-row');
    removeBtn.style.display = 'inline-block';
    removeBtn.onclick = function() { newRow.remove(); };
    container.appendChild(newRow);
});
document.querySelectorAll('.remove-row')[0].style.display = 'none';
</script>
{% endblock %}
