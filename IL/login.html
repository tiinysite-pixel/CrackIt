<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <!-- Bootstrap 5 + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Google Font (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    /* ----- RESET & BODY (Neumorphic background) ----- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e0e5ec;
      padding: 1.5rem;
      margin: 0;
    }

    /* ----- MAIN WRAPPER ----- */
    .login-wrapper {
      max-width: 400px;
      width: 100%;
    }

    /* ----- NEUMORPHIC CARD ----- */
    .login-card {
      background: #e0e5ec;
      border-radius: 40px;
      padding: 2.5rem 2.2rem;
      box-shadow: 
        12px 12px 24px #b8bec6,
        -12px -12px 24px #ffffff;
      transition: all 0.2s ease;
    }
    .login-card:hover {
      box-shadow: 
        8px 8px 16px #b8bec6,
        -8px -8px 16px #ffffff;
    }
    .login-card h3 {
      font-weight: 700;
      font-size: 1.8rem;
      color: #2d3a4a;
      text-align: center;
      margin-bottom: 0.25rem;
      text-shadow: 0 2px 4px rgba(255,255,255,0.6);
    }
    .login-card .subtitle {
      text-align: center;
      color: #5a6b7c;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      text-shadow: 0 1px 2px rgba(255,255,255,0.5);
    }

    /* ----- FORM ELEMENTS (neumorphic inset) ----- */
    .form-label {
      font-weight: 500;
      font-size: 0.85rem;
      color: #3d4a5a;
      margin-bottom: 0.2rem;
    }
    .form-control {
      background: #e0e5ec;
      border: none;
      border-radius: 16px;
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
      color: #1f2937;
      box-shadow: 
        inset 4px 4px 8px #b8bec6,
        inset -4px -4px 8px #ffffff;
      transition: all 0.2s ease;
      height: 46px;
    }
    .form-control:focus {
      outline: none;
      box-shadow: 
        inset 3px 3px 6px #b8bec6,
        inset -3px -3px 6px #ffffff,
        0 0 0 3px rgba(79,122,252,0.15);
      background: #e0e5ec;
    }
    .form-control.is-valid {
      box-shadow: 
        inset 4px 4px 8px #b8bec6,
        inset -4px -4px 8px #ffffff,
        0 0 0 2px #38a16940;
    }
    .form-control.is-invalid {
      box-shadow: 
        inset 4px 4px 8px #b8bec6,
        inset -4px -4px 8px #ffffff,
        0 0 0 2px #e53e3e40;
    }
    .form-control::placeholder {
      color: #a0aec0;
      font-weight: 300;
    }

    .input-group .form-control {
      border-radius: 16px 0 0 16px;
    }
    .input-group .btn-outline-secondary {
      background: #e0e5ec;
      border: none;
      border-radius: 0 16px 16px 0;
      box-shadow: 
        inset 4px 4px 8px #b8bec6,
        inset -4px -4px 8px #ffffff;
      color: #4a5568;
      height: 46px;
      padding: 0 1rem;
    }
    .input-group .btn-outline-secondary:hover {
      background: #d5dce6;
    }
    .input-group .btn-outline-secondary:focus {
      box-shadow: inset 3px 3px 6px #b8bec6, inset -3px -3px 6px #ffffff;
    }

    /* Error message */
    .error-message {
      font-size: 0.85rem;
      color: #e53e3e;
      margin-top: 0.5rem;
      display: none;
    }
    .error-message.show {
      display: block;
    }

    /* ----- BUTTONS (neumorphic raised) ----- */
    .btn-primary {
      background: #e0e5ec;
      border: none;
      border-radius: 40px;
      padding: 0.65rem 2rem;
      font-weight: 600;
      color: #2d3a4a;
      box-shadow: 
        6px 6px 12px #b8bec6,
        -6px -6px 12px #ffffff;
      transition: all 0.2s ease;
      font-size: 0.95rem;
      width: 100%;
    }
    .btn-primary:hover {
      box-shadow: 
        3px 3px 6px #b8bec6,
        -3px -3px 6px #ffffff;
      transform: translateY(-2px);
    }
    .btn-primary:active {
      box-shadow: 
        inset 4px 4px 8px #b8bec6,
        inset -4px -4px 8px #ffffff;
      transform: translateY(0);
    }

    .forgot-link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    .forgot-link a {
      color: #4a5568;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px dashed #b8bec6;
    }
    .forgot-link a:hover {
      border-bottom-color: #4a5568;
    }

    .register-link {
      text-align: center;
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: #5a6b7c;
    }
    .register-link a {
      color: #4a5568;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px dashed #b8bec6;
    }
    .register-link a:hover {
      border-bottom-color: #4a5568;
    }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 480px) {
      .login-card { padding: 2rem 1.2rem; }
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <h3><i class="bi bi-box-arrow-in-right me-2" style="color:#4f7afc;"></i>Welcome Back</h3>
    <p class="subtitle">Login to your account</p>

    <form id="loginForm" novalidate>

      <!-- User ID -->
      <div class="mb-3">
        <label for="userId" class="form-label">User ID <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="userId" 
               placeholder="Enter your User ID" 
               minlength="5" maxlength="20" required />
        <div class="invalid-feedback">User ID Required</div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" 
                 placeholder="Enter your password" maxlength="30" required />
          <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn">
            <i class="bi bi-eye-slash"></i>
          </button>
        </div>
        <div class="invalid-feedback" id="passwordError">Invalid password.</div>
      </div>

      <!-- General error -->
      <div class="error-message" id="generalError">
        <i class="bi bi-exclamation-circle me-1"></i> Invalid credentials. Please try again.
      </div>

      <button type="submit" class="btn btn-primary mt-2">Login <i class="bi bi-arrow-right ms-1"></i></button>

      <div class="forgot-link">
        <a href="#">Forgot password?</a>
      </div>

      <div class="register-link">
        Don't have an account? <a href="#">Register here</a>
      </div>
    </form>
  </div>
</div>

<script>
  (function() {
    'use strict';

    const form = document.getElementById('loginForm');
    const userId = document.getElementById('userId');
    const password = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const generalError = document.getElementById('generalError');

    // Toggle password visibility
    toggleBtn.addEventListener('click', function() {
      const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
      password.setAttribute('type', type);
      const icon = this.querySelector('i');
      icon.classList.toggle('bi-eye');
      icon.classList.toggle('bi-eye-slash');
    });

    // User ID real‑time validation (min 5, max 20)
    userId.addEventListener('input', function() {
      const len = this.value.length;
      if (this.value && (len < 5 || len > 20)) {
        this.setCustomValidity('Invalid');
        this.classList.add('is-invalid');
        this.classList.remove('is-valid');
      } else {
        this.setCustomValidity('');
        if (this.value) {
          this.classList.remove('is-invalid');
          this.classList.add('is-valid');
        } else {
          this.classList.remove('is-valid', 'is-invalid');
        }
      }
      generalError.classList.remove('show');
    });

    // Password field: only required, no policy hints
    password.addEventListener('input', function() {
      if (this.value) {
        this.setCustomValidity('');
        this.classList.remove('is-invalid');
        this.classList.add('is-valid');
      } else {
        this.classList.remove('is-valid');
        this.classList.add('is-invalid');
      }
      generalError.classList.remove('show');
    });

    // Form submission
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      e.stopPropagation();

      let valid = true;

      // User ID
      const uid = userId.value.trim();
      if (!uid || uid.length < 5 || uid.length > 20) {
        userId.setCustomValidity('Invalid');
        userId.classList.add('is-invalid');
        userId.classList.remove('is-valid');
        valid = false;
      } else {
        userId.setCustomValidity('');
        userId.classList.remove('is-invalid');
        userId.classList.add('is-valid');
      }

      // Password (just check if empty)
      const pwd = password.value;
      if (!pwd) {
        password.setCustomValidity('Invalid');
        password.classList.add('is-invalid');
        password.classList.remove('is-valid');
        valid = false;
      } else {
        password.setCustomValidity('');
        password.classList.remove('is-invalid');
        password.classList.add('is-valid');
      }

      if (!valid) {
        generalError.classList.remove('show');
        return;
      }

      // Mock login (demo)
      // Replace with actual API call
      if (uid === 'admin' && pwd === 'Admin@123') {
        generalError.classList.remove('show');
        alert('Login successful! Redirecting to dashboard...');
        // window.location.href = '/dashboard';
      } else {
        generalError.textContent = 'Invalid User ID or password.';
        generalError.classList.add('show');
      }
    });

  })();
</script>
</body>
</html>
